<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Logic Gate Simulator</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --wire-off: #4b5563;
            --wire-on: #00ff88;
            --gate-color: #c9d1d9;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --accent: #00ff88;
            --danger: #ff4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            padding: 2rem 1rem 1rem;
            background: linear-gradient(180deg, #161b22 0%, #0d1117 100%);
            border-bottom: 1px solid #30363d;
        }

        header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            color: var(--accent);
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
            margin-bottom: 0.5rem;
        }

        header p { color: var(--text-muted); font-size: 1.1rem; margin-bottom: 1.5rem; }

        /* Gate Selector */
        .gate-selector {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            flex-wrap: wrap;
            max-width: 800px;
            margin: 0 auto;
        }

        .gate-btn {
            background: transparent;
            border: 2px solid #30363d;
            color: var(--text-muted);
            padding: 0.5rem 1.5rem;
            border-radius: 20px;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .gate-btn:hover { border-color: var(--gate-color); color: var(--text-main); }
        .gate-btn.active { background: rgba(0,255,136,0.1); border-color: var(--accent); color: var(--accent); text-shadow: 0 0 5px rgba(0,255,136,0.5); }

        .main-container {
            display: flex;
            flex: 1;
            padding: 2rem;
            gap: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        /* Simulator Area */
        .simulator-panel {
            flex: 2;
            background: var(--panel-bg);
            border-radius: 16px;
            padding: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #30363d;
            position: relative;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5);
            min-height: 400px;
        }

        .circuit-board { display: flex; align-items: center; gap: 2rem; position: relative; }
        .inputs-column { display: flex; flex-direction: column; gap: 4rem; transition: all 0.3s ease; }
        .switch-container { display: flex; align-items: center; gap: 1rem; transition: opacity 0.3s ease; }
        .switch-container.hidden { opacity: 0; pointer-events: none; position: absolute; }
        
        .switch-label { font-family: 'Orbitron', sans-serif; font-size: 1.5rem; font-weight: 700; }
        
        .toggle-switch { position: relative; width: 60px; height: 34px; cursor: pointer; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--wire-off); border-radius: 34px; transition: .4s;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }
        .slider:before {
            position: absolute; content: "0"; height: 26px; width: 26px; left: 4px; bottom: 4px;
            background-color: white; border-radius: 50%; transition: .4s;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Orbitron', sans-serif; font-size: 14px; color: #000; font-weight: bold;
        }
        input:checked + .slider { background-color: var(--accent); box-shadow: 0 0 15px var(--accent); }
        input:checked + .slider:before { transform: translateX(26px); content: "1"; }

        /* SVG Components */
        .svg-container { position: relative; }
        .wire { stroke: var(--wire-off); stroke-width: 6; stroke-linecap: round; transition: stroke 0.3s ease, filter 0.3s ease; fill: none; }
        .wire.active { stroke: var(--wire-on); filter: drop-shadow(0 0 8px var(--wire-on)); }
        
        .gate-shape { fill: #21262d; stroke: var(--gate-color); stroke-width: 4; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3)); transition: all 0.3s ease; }
        .gate-text { fill: #c9d1d9; font-family: 'Orbitron', sans-serif; font-size: 20px; font-weight: bold; text-anchor: middle; transition: all 0.3s ease; }

        /* Bulb */
        .bulb-container { display: flex; align-items: center; gap: 1rem; }
        .bulb { font-size: 4rem; color: var(--wire-off); transition: color 0.3s ease, text-shadow 0.3s ease; }
        .bulb.active { color: #ffea00; text-shadow: 0 0 20px #ffea00, 0 0 40px #ffea00; }

        .output-val {
            font-family: 'Orbitron', sans-serif; font-size: 2rem; font-weight: 700;
            color: var(--wire-off); background: #000; padding: 0.5rem 1rem;
            border-radius: 8px; border: 2px solid var(--wire-off); transition: all 0.3s ease;
        }
        .output-val.active { color: var(--wire-on); border-color: var(--wire-on); box-shadow: 0 0 15px rgba(0,255,136,0.3); }

        /* Truth Table Area */
        .table-panel {
            flex: 1; background: var(--panel-bg); border-radius: 16px; padding: 2rem;
            border: 1px solid #30363d; display: flex; flex-direction: column;
        }
        .table-panel h2 { font-family: 'Orbitron', sans-serif; margin-bottom: 1.5rem; text-align: center; color: var(--gate-color); }
        
        .truth-table { width: 100%; border-collapse: collapse; text-align: center; font-family: 'Orbitron', sans-serif; }
        .truth-table th { padding: 1rem; background: #21262d; color: var(--accent); border: 1px solid #30363d; }
        .truth-table td { padding: 1rem; border: 1px solid #30363d; font-size: 1.2rem; color: var(--wire-off); transition: color 0.3s; }
        .truth-table tr { transition: background-color 0.3s, box-shadow 0.3s; }
        .truth-table tr.discovered { background-color: rgba(0, 255, 136, 0.05); }
        .truth-table tr.discovered td { color: var(--text-main); }
        .truth-table tr.current { background-color: rgba(0, 255, 136, 0.15); box-shadow: inset 0 0 10px rgba(0, 255, 136, 0.2); }
        .truth-table tr.current td { color: var(--wire-on); text-shadow: 0 0 5px rgba(0,255,136,0.5); }
        
        .col-hidden { display: none; }

        /* Modal / Success State */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(5px);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
        }
        .modal-overlay.show { opacity: 1; pointer-events: all; }
        .modal-content {
            background: var(--panel-bg); padding: 3rem; border-radius: 16px;
            border: 1px solid var(--accent); text-align: center;
            box-shadow: 0 0 40px rgba(0,255,136,0.2); transform: translateY(20px); transition: transform 0.4s ease;
        }
        .modal-overlay.show .modal-content { transform: translateY(0); }
        .modal-content i { font-size: 4rem; color: var(--accent); margin-bottom: 1rem; text-shadow: 0 0 20px rgba(0,255,136,0.5); }
        .modal-content h2 { font-family: 'Orbitron', sans-serif; font-size: 2rem; margin-bottom: 1rem; }
        .modal-content p { color: var(--text-muted); margin-bottom: 2rem; }

        .btn-reset {
            background: var(--accent); color: #000; border: none; padding: 1rem 2rem;
            font-size: 1.1rem; font-weight: 700; font-family: 'Orbitron', sans-serif;
            border-radius: 8px; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 0 15px rgba(0,255,136,0.4);
        }
        .btn-reset:hover { transform: scale(1.05); box-shadow: 0 0 25px rgba(0,255,136,0.6); }

        .progress-container { margin-top: 1.5rem; text-align: center; }
        .progress-text { margin-bottom: 0.5rem; font-weight: 500; color: var(--text-muted); }
        .progress-bar { width: 100%; height: 10px; background: #21262d; border-radius: 5px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.5s ease; box-shadow: 0 0 10px var(--accent); }

        @media (max-width: 900px) { .main-container { flex-direction: column; } .circuit-board { transform: scale(0.8); } }
        @media (max-width: 600px) { .circuit-board { transform: scale(0.6); } .gate-btn { padding: 0.4rem 1rem; font-size: 0.9rem; } }
    </style>
</head>
<body>

    <header>
        <h1>Universal Logic Gate Simulator</h1>
        <p>Select a gate and explore all combinations to complete its Truth Table!</p>
        <div class="gate-selector" id="gateSelector">
            <button class="gate-btn active" data-gate="AND">AND</button>
            <button class="gate-btn" data-gate="OR">OR</button>
            <button class="gate-btn" data-gate="NOT">NOT</button>
            <button class="gate-btn" data-gate="NAND">NAND</button>
            <button class="gate-btn" data-gate="NOR">NOR</button>
            <button class="gate-btn" data-gate="XOR">XOR</button>
            <button class="gate-btn" data-gate="XNOR">XNOR</button>
        </div>
    </header>

    <div class="main-container">
        
        <!-- Left Panel: Simulator -->
        <div class="simulator-panel">
            <div class="circuit-board">
                
                <!-- Inputs -->
                <div class="inputs-column" id="inputsColumn">
                    <div class="switch-container" id="containerA">
                        <span class="switch-label">A</span>
                        <label class="toggle-switch">
                            <input type="checkbox" id="switchA">
                            <span class="slider"></span>
                        </label>
                    </div>
                    
                    <div class="switch-container" id="containerB">
                        <span class="switch-label">B</span>
                        <label class="toggle-switch">
                            <input type="checkbox" id="switchB">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>

                <!-- SVG Wires and Gates -->
                <div class="svg-container">
                    <svg viewBox="0 0 200 150" width="200" height="150" id="circuitSvg">
                        <!-- Input Wires -->
                        <line id="wireA" class="wire" x1="0" y1="35" x2="40" y2="35" />
                        <line id="wireB" class="wire" x1="0" y1="115" x2="40" y2="115" />
                        
                        <!-- Gate Group -->
                        <g id="gateGroup">
                            <!-- Gate paths will be injected here via JS -->
                        </g>
                        
                        <!-- Output Wire -->
                        <line id="wireY" class="wire" x1="160" y1="75" x2="200" y2="75" />
                    </svg>
                </div>

                <!-- Output Bulb -->
                <div class="bulb-container">
                    <i id="bulbIcon" class="fas fa-lightbulb bulb"></i>
                    <div id="outputVal" class="output-val">0</div>
                </div>

            </div>
        </div>

        <!-- Right Panel: Truth Table -->
        <div class="table-panel">
            <h2 id="tableTitle">AND Truth Table</h2>
            <table class="truth-table">
                <thead>
                    <tr>
                        <th>Input A</th>
                        <th id="thInputB">Input B</th>
                        <th>Output Y</th>
                    </tr>
                </thead>
                <tbody id="truthTableBody">
                    <!-- Rows injected by JS -->
                </tbody>
            </table>

            <div class="progress-container">
                <div class="progress-text">Progress: <span id="progressText">0/4</span> states found</div>
                <div class="progress-bar">
                    <div id="progressFill" class="progress-fill"></div>
                </div>
            </div>
        </div>

    </div>

    <!-- Success Modal -->
    <div id="successModal" class="modal-overlay">
        <div class="modal-content">
            <i class="fas fa-microchip"></i>
            <h2>Simulation Complete!</h2>
            <p>You've successfully explored all combinations for the <span id="modalGateName">AND</span> gate.</p>
            <button class="btn-reset" onclick="resetSimulator()">Restart Gate</button>
        </div>
    </div>

    <script>
        // DOM Elements
        const switchA = document.getElementById('switchA');
        const switchB = document.getElementById('switchB');
        const containerB = document.getElementById('containerB');
        const wireA = document.getElementById('wireA');
        const wireB = document.getElementById('wireB');
        const wireY = document.getElementById('wireY');
        const bulbIcon = document.getElementById('bulbIcon');
        const outputVal = document.getElementById('outputVal');
        const gateGroup = document.getElementById('gateGroup');
        const truthTableBody = document.getElementById('truthTableBody');
        const thInputB = document.getElementById('thInputB');
        const tableTitle = document.getElementById('tableTitle');
        const progressText = document.getElementById('progressText');
        const progressFill = document.getElementById('progressFill');
        const successModal = document.getElementById('successModal');
        const modalGateName = document.getElementById('modalGateName');
        const inputsColumn = document.getElementById('inputsColumn');

        // State
        let currentGate = 'AND';
        let discoveredStates = new Set();
        let targetStatesCount = 4;

        // Gate Definitions (Logic and SVG Paths)
        const gateDefs = {
            'AND': {
                logic: (a, b) => a && b,
                svg: `<path class="gate-shape" d="M 40 15 L 100 15 A 60 60 0 0 1 100 135 L 40 135 Z" />
                      <text x="75" y="82" class="gate-text">AND</text>`,
                inputs: 2
            },
            'OR': {
                logic: (a, b) => a || b,
                svg: `<path class="gate-shape" d="M 40 15 Q 90 15 150 75 Q 90 135 40 135 Q 70 75 40 15 Z" />
                      <text x="80" y="82" class="gate-text">OR</text>`,
                inputs: 2
            },
            'NOT': {
                logic: (a) => !a,
                svg: `<path class="gate-shape" d="M 60 25 L 130 75 L 60 125 Z" />
                      <circle cx="140" cy="75" r="10" class="gate-shape" />
                      <text x="85" y="82" class="gate-text" style="font-size: 16px;">NOT</text>`,
                inputs: 1
            },
            'NAND': {
                logic: (a, b) => !(a && b),
                svg: `<path class="gate-shape" d="M 40 15 L 100 15 A 60 60 0 0 1 100 135 L 40 135 Z" />
                      <circle cx="150" cy="75" r="10" class="gate-shape" />
                      <text x="75" y="82" class="gate-text" style="font-size: 16px;">NAND</text>`,
                inputs: 2
            },
            'NOR': {
                logic: (a, b) => !(a || b),
                svg: `<path class="gate-shape" d="M 40 15 Q 90 15 145 75 Q 90 135 40 135 Q 70 75 40 15 Z" />
                      <circle cx="155" cy="75" r="10" class="gate-shape" />
                      <text x="75" y="82" class="gate-text" style="font-size: 16px;">NOR</text>`,
                inputs: 2
            },
            'XOR': {
                logic: (a, b) => a !== b,
                svg: `<path class="gate-shape" d="M 50 15 Q 95 15 150 75 Q 95 135 50 135 Q 80 75 50 15 Z" />
                      <path d="M 35 15 Q 65 75 35 135" fill="none" stroke="var(--gate-color)" stroke-width="4" />
                      <text x="85" y="82" class="gate-text" style="font-size: 16px;">XOR</text>`,
                inputs: 2
            },
            'XNOR': {
                logic: (a, b) => a === b,
                svg: `<path class="gate-shape" d="M 50 15 Q 95 15 145 75 Q 95 135 50 135 Q 80 75 50 15 Z" />
                      <path d="M 35 15 Q 65 75 35 135" fill="none" stroke="var(--gate-color)" stroke-width="4" />
                      <circle cx="155" cy="75" r="10" class="gate-shape" />
                      <text x="82" y="82" class="gate-text" style="font-size: 14px;">XNOR</text>`,
                inputs: 2
            }
        };

        // Initialize Gate
        function setGate(gateName) {
            currentGate = gateName;
            const def = gateDefs[gateName];
            targetStatesCount = def.inputs === 1 ? 2 : 4;
            
            // Update UI Labels
            tableTitle.innerText = `${gateName} Truth Table`;
            modalGateName.innerText = gateName;
            
            // Draw Gate SVG
            gateGroup.innerHTML = def.svg;
            
            // Handle NOT gate specialized UI (1 input)
            if (def.inputs === 1) {
                containerB.classList.add('hidden');
                wireB.style.display = 'none';
                wireA.setAttribute('y1', '75');
                wireA.setAttribute('y2', '75');
                thInputB.classList.add('col-hidden');
                inputsColumn.style.gap = '0';
            } else {
                containerB.classList.remove('hidden');
                wireB.style.display = 'block';
                wireA.setAttribute('y1', '35');
                wireA.setAttribute('y2', '35');
                thInputB.classList.remove('col-hidden');
                inputsColumn.style.gap = '4rem';
            }

            buildTruthTable();
            resetSimulator();
        }

        // Build Truth Table HTML
        function buildTruthTable() {
            let html = '';
            const inputs = gateDefs[currentGate].inputs;
            
            if (inputs === 1) {
                // 1 Input combinations
                [0, 1].forEach(a => {
                    const y = gateDefs[currentGate].logic(a) ? 1 : 0;
                    html += `<tr id="row-${a}">
                                <td>${a}</td>
                                <td class="col-hidden"></td>
                                <td>${y}</td>
                             </tr>`;
                });
            } else {
                // 2 Input combinations
                [[0,0], [0,1], [1,0], [1,1]].forEach(([a, b]) => {
                    const y = gateDefs[currentGate].logic(a, b) ? 1 : 0;
                    html += `<tr id="row-${a}${b}">
                                <td>${a}</td>
                                <td>${b}</td>
                                <td>${y}</td>
                             </tr>`;
                });
            }
            truthTableBody.innerHTML = html;
        }

        function updateLogic() {
            const valA = switchA.checked ? 1 : 0;
            const valB = switchB.checked ? 1 : 0;
            const inputs = gateDefs[currentGate].inputs;
            
            let valY = 0;
            let stateCode = '';

            if (inputs === 1) {
                valY = gateDefs[currentGate].logic(valA) ? 1 : 0;
                stateCode = `${valA}`;
            } else {
                valY = gateDefs[currentGate].logic(valA, valB) ? 1 : 0;
                stateCode = `${valA}${valB}`;
            }

            // Update Wires Visuals
            if (valA) wireA.classList.add('active'); else wireA.classList.remove('active');
            if (inputs === 2) {
                if (valB) wireB.classList.add('active'); else wireB.classList.remove('active');
            }
            
            // Update Output Visuals
            if (valY) {
                wireY.classList.add('active');
                bulbIcon.classList.add('active');
                outputVal.classList.add('active');
                outputVal.innerText = "1";
            } else {
                wireY.classList.remove('active');
                bulbIcon.classList.remove('active');
                outputVal.classList.remove('active');
                outputVal.innerText = "0";
            }

            // Update Truth Table UI
            document.querySelectorAll('.truth-table tr').forEach(row => row.classList.remove('current'));
            const activeRow = document.getElementById(`row-${stateCode}`);
            if (activeRow) {
                activeRow.classList.add('current', 'discovered');
            }

            // Record discovery
            if (!discoveredStates.has(stateCode)) {
                discoveredStates.add(stateCode);
                updateProgress();
            }
        }

        function updateProgress() {
            const count = discoveredStates.size;
            progressText.innerText = `${count}/${targetStatesCount}`;
            progressFill.style.width = `${(count / targetStatesCount) * 100}%`;

            if (count === targetStatesCount) {
                setTimeout(() => { successModal.classList.add('show'); }, 500);
            }
        }

        function resetSimulator() {
            discoveredStates.clear();
            updateProgress();
            
            switchA.checked = false;
            switchB.checked = false;
            
            document.querySelectorAll('.truth-table tr').forEach(row => {
                row.classList.remove('current', 'discovered');
            });
            
            successModal.classList.remove('show');
            updateLogic();
        }

        // Event Listeners for Switches
        switchA.addEventListener('change', updateLogic);
        switchB.addEventListener('change', updateLogic);

        // Event Listeners for Gate Selector
        document.querySelectorAll('.gate-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.gate-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                setGate(this.dataset.gate);
            });
        });

        // Initial setup
        setGate('AND');
    </script>
</body>
</html>
