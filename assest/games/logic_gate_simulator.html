<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AND Gate Simulator</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --wire-off: #4b5563;
            --wire-on: #00ff88;
            --gate-color: #c9d1d9;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --accent: #00ff88;
            --danger: #ff4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            padding: 2rem 1rem;
            background: linear-gradient(180deg, #161b22 0%, #0d1117 100%);
            border-bottom: 1px solid #30363d;
        }

        header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            color: var(--accent);
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .main-container {
            display: flex;
            flex: 1;
            padding: 2rem;
            gap: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        /* Simulator Area */
        .simulator-panel {
            flex: 2;
            background: var(--panel-bg);
            border-radius: 16px;
            padding: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #30363d;
            position: relative;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5);
        }

        .circuit-board {
            display: flex;
            align-items: center;
            gap: 2rem;
            position: relative;
        }

        /* Switches */
        .inputs-column {
            display: flex;
            flex-direction: column;
            gap: 4rem;
        }

        .switch-container {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .switch-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .toggle-switch {
            position: relative;
            width: 60px;
            height: 34px;
            cursor: pointer;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--wire-off);
            border-radius: 34px;
            transition: .4s;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }

        .slider:before {
            position: absolute;
            content: "0";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            border-radius: 50%;
            transition: .4s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            color: #000;
            font-weight: bold;
        }

        input:checked + .slider {
            background-color: var(--accent);
            box-shadow: 0 0 15px var(--accent);
        }

        input:checked + .slider:before {
            transform: translateX(26px);
            content: "1";
        }

        /* Wires and Gate */
        .svg-container {
            position: relative;
        }

        .wire {
            stroke: var(--wire-off);
            stroke-width: 6;
            stroke-linecap: round;
            transition: stroke 0.3s ease, filter 0.3s ease;
        }

        .wire.active {
            stroke: var(--wire-on);
            filter: drop-shadow(0 0 8px var(--wire-on));
        }

        .gate {
            fill: #21262d;
            stroke: var(--gate-color);
            stroke-width: 4;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
        }

        /* Bulb */
        .bulb-container {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .bulb {
            font-size: 4rem;
            color: var(--wire-off);
            transition: color 0.3s ease, text-shadow 0.3s ease;
        }

        .bulb.active {
            color: #ffea00;
            text-shadow: 0 0 20px #ffea00, 0 0 40px #ffea00;
        }

        /* Output Value Display */
        .output-val {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--wire-off);
            background: #000;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            border: 2px solid var(--wire-off);
            transition: all 0.3s ease;
        }

        .output-val.active {
            color: var(--wire-on);
            border-color: var(--wire-on);
            box-shadow: 0 0 15px rgba(0,255,136,0.3);
        }

        /* Truth Table Area */
        .table-panel {
            flex: 1;
            background: var(--panel-bg);
            border-radius: 16px;
            padding: 2rem;
            border: 1px solid #30363d;
            display: flex;
            flex-direction: column;
        }

        .table-panel h2 {
            font-family: 'Orbitron', sans-serif;
            margin-bottom: 1.5rem;
            text-align: center;
            color: var(--gate-color);
        }

        .truth-table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-family: 'Orbitron', sans-serif;
        }

        .truth-table th {
            padding: 1rem;
            background: #21262d;
            color: var(--accent);
            border: 1px solid #30363d;
        }

        .truth-table td {
            padding: 1rem;
            border: 1px solid #30363d;
            font-size: 1.2rem;
            color: var(--wire-off);
            transition: color 0.3s;
        }

        .truth-table tr {
            transition: background-color 0.3s, box-shadow 0.3s;
        }

        .truth-table tr.discovered {
            background-color: rgba(0, 255, 136, 0.05);
        }

        .truth-table tr.discovered td {
            color: var(--text-main);
        }

        .truth-table tr.current {
            background-color: rgba(0, 255, 136, 0.15);
            box-shadow: inset 0 0 10px rgba(0, 255, 136, 0.2);
        }
        
        .truth-table tr.current td {
            color: var(--wire-on);
            text-shadow: 0 0 5px rgba(0,255,136,0.5);
        }

        /* Modal / Success State */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .modal-overlay.show {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            background: var(--panel-bg);
            padding: 3rem;
            border-radius: 16px;
            border: 1px solid var(--accent);
            text-align: center;
            box-shadow: 0 0 40px rgba(0,255,136,0.2);
            transform: translateY(20px);
            transition: transform 0.4s ease;
        }

        .modal-overlay.show .modal-content {
            transform: translateY(0);
        }

        .modal-content i {
            font-size: 4rem;
            color: var(--accent);
            margin-bottom: 1rem;
            text-shadow: 0 0 20px rgba(0,255,136,0.5);
        }

        .modal-content h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .modal-content p {
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .btn-reset {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 1rem 2rem;
            font-size: 1.1rem;
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0,255,136,0.4);
        }

        .btn-reset:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(0,255,136,0.6);
        }

        .progress-container {
            margin-top: 1.5rem;
            text-align: center;
        }

        .progress-text {
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: #21262d;
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.5s ease;
            box-shadow: 0 0 10px var(--accent);
        }

        @media (max-width: 900px) {
            .main-container {
                flex-direction: column;
            }
            .circuit-board {
                transform: scale(0.8);
            }
        }
        @media (max-width: 600px) {
            .circuit-board {
                transform: scale(0.6);
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>AND Gate Simulator</h1>
        <p>Explore all combinations to complete the Truth Table!</p>
    </header>

    <div class="main-container">
        
        <!-- Left Panel: Simulator -->
        <div class="simulator-panel">
            <div class="circuit-board">
                
                <!-- Inputs -->
                <div class="inputs-column">
                    <div class="switch-container">
                        <span class="switch-label">A</span>
                        <label class="toggle-switch">
                            <input type="checkbox" id="switchA">
                            <span class="slider"></span>
                        </label>
                    </div>
                    
                    <div class="switch-container">
                        <span class="switch-label">B</span>
                        <label class="toggle-switch">
                            <input type="checkbox" id="switchB">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>

                <!-- SVG AND Gate and Wires -->
                <div class="svg-container">
                    <svg viewBox="0 0 200 150" width="200" height="150">
                        <!-- Input Wire A -->
                        <line id="wireA" class="wire" x1="0" y1="35" x2="40" y2="35" />
                        <!-- Input Wire B -->
                        <line id="wireB" class="wire" x1="0" y1="115" x2="40" y2="115" />
                        
                        <!-- AND Gate Shape -->
                        <path class="gate" d="M 40 15 L 100 15 A 60 60 0 0 1 100 135 L 40 135 Z" />
                        
                        <!-- Text inside gate -->
                        <text x="60" y="80" fill="#c9d1d9" font-family="Orbitron" font-size="20" font-weight="bold">AND</text>
                        
                        <!-- Output Wire -->
                        <line id="wireY" class="wire" x1="160" y1="75" x2="200" y2="75" />
                    </svg>
                </div>

                <!-- Output Bulb -->
                <div class="bulb-container">
                    <i id="bulbIcon" class="fas fa-lightbulb bulb"></i>
                    <div id="outputVal" class="output-val">0</div>
                </div>

            </div>
        </div>

        <!-- Right Panel: Truth Table -->
        <div class="table-panel">
            <h2>Truth Table</h2>
            <table class="truth-table">
                <thead>
                    <tr>
                        <th>Input A</th>
                        <th>Input B</th>
                        <th>Output Y</th>
                    </tr>
                </thead>
                <tbody>
                    <tr id="row-00">
                        <td>0</td>
                        <td>0</td>
                        <td>0</td>
                    </tr>
                    <tr id="row-01">
                        <td>0</td>
                        <td>1</td>
                        <td>0</td>
                    </tr>
                    <tr id="row-10">
                        <td>1</td>
                        <td>0</td>
                        <td>0</td>
                    </tr>
                    <tr id="row-11">
                        <td>1</td>
                        <td>1</td>
                        <td>1</td>
                    </tr>
                </tbody>
            </table>

            <div class="progress-container">
                <div class="progress-text">Progress: <span id="progressText">0/4</span> states found</div>
                <div class="progress-bar">
                    <div id="progressFill" class="progress-fill"></div>
                </div>
            </div>
        </div>

    </div>

    <!-- Success Modal -->
    <div id="successModal" class="modal-overlay">
        <div class="modal-content">
            <i class="fas fa-microchip"></i>
            <h2>Simulation Complete!</h2>
            <p>You've successfully explored all possible input combinations for the AND gate.</p>
            <button class="btn-reset" onclick="resetSimulator()">Restart Simulator</button>
        </div>
    </div>

    <script>
        const switchA = document.getElementById('switchA');
        const switchB = document.getElementById('switchB');
        
        const wireA = document.getElementById('wireA');
        const wireB = document.getElementById('wireB');
        const wireY = document.getElementById('wireY');
        
        const bulbIcon = document.getElementById('bulbIcon');
        const outputVal = document.getElementById('outputVal');
        
        const progressText = document.getElementById('progressText');
        const progressFill = document.getElementById('progressFill');
        const successModal = document.getElementById('successModal');

        let discoveredStates = new Set();

        function updateLogic() {
            const valA = switchA.checked ? 1 : 0;
            const valB = switchB.checked ? 1 : 0;
            
            // AND Gate Logic
            const valY = (valA === 1 && valB === 1) ? 1 : 0;

            // Update Wires Visuals
            if (valA) wireA.classList.add('active'); else wireA.classList.remove('active');
            if (valB) wireB.classList.add('active'); else wireB.classList.remove('active');
            
            // Update Output Visuals
            if (valY) {
                wireY.classList.add('active');
                bulbIcon.classList.add('active');
                outputVal.classList.add('active');
                outputVal.innerText = "1";
            } else {
                wireY.classList.remove('active');
                bulbIcon.classList.remove('active');
                outputVal.classList.remove('active');
                outputVal.innerText = "0";
            }

            // Update Truth Table UI
            const stateCode = `${valA}${valB}`;
            
            // Remove 'current' class from all rows
            document.querySelectorAll('.truth-table tr').forEach(row => row.classList.remove('current'));
            
            // Add 'current' and 'discovered' to active row
            const activeRow = document.getElementById(`row-${stateCode}`);
            if (activeRow) {
                activeRow.classList.add('current');
                activeRow.classList.add('discovered');
            }

            // Record discovery
            if (!discoveredStates.has(stateCode)) {
                discoveredStates.add(stateCode);
                updateProgress();
            }
        }

        function updateProgress() {
            const count = discoveredStates.size;
            progressText.innerText = `${count}/4`;
            progressFill.style.width = `${(count / 4) * 100}%`;

            if (count === 4) {
                setTimeout(() => {
                    successModal.classList.add('show');
                }, 500);
            }
        }

        function resetSimulator() {
            // Reset state tracking
            discoveredStates.clear();
            updateProgress();
            
            // Reset switches
            switchA.checked = false;
            switchB.checked = false;
            
            // Remove table styling
            document.querySelectorAll('.truth-table tr').forEach(row => {
                row.classList.remove('current', 'discovered');
            });
            
            // Hide modal
            successModal.classList.remove('show');
            
            // Trigger logic update for visuals
            updateLogic();
        }

        // Event Listeners
        switchA.addEventListener('change', updateLogic);
        switchB.addEventListener('change', updateLogic);

        // Initial setup
        resetSimulator();
    </script>
</body>
</html>
